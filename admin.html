<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход | Админ-панель</title>
    <link rel="stylesheet" href="admin.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <!-- Форма входа -->
    <div id="loginForm" class="login-container">
        <h1>Вход в админ-панель</h1>
        <div class="form-group">
            <label>Логин</label>
            <input type="text" id="username" placeholder="Введите логин">
        </div>
        <div class="form-group">
            <label>Пароль</label>
            <input type="password" id="password" placeholder="Введите пароль">
        </div>
        <button class="btn-login" onclick="login()">Войти</button>
        <div id="loginError" class="error-message">Неверный логин или пароль</div>
    </div>

    <!-- Админ-панель (скрыта) -->
    <div id="adminPanel" class="admin-container">
        <div class="admin-header">
            <h1>Панель управления</h1>
            <button class="logout-btn" onclick="logout()">Выйти</button>
        </div>
        
        <div class="tabs">
            <button class="tab active" id="btnNews">Новости</button>
            <button class="tab" id="btnEvents">Мероприятия</button>
        </div>

        <!-- Форма новостей -->
         <div id="newsTab" class="tab-content active">
            <h2>Добавить новость</h2>
            <form id="newsForm" class="admin-form">
                <div class="form-group">
                    <label>Заголовок *</label>
                    <input type="text" id="newsTitle" placeholder="Максимум 5 слов!" >
                </div>
                <div class="form-group">
                    <label>Описание *</label>
                    <textarea id="newsDescription" placeholder="От 8 до 10 слов"></textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Дата *</label>
                        <input type="date" id="newsDate">
                    </div>
                    <div class="form-group">
                        <label>Адрес *</label>
                        <input type="text" id="newsAddress">
                    </div>
                </div>
                <div class="form-group">
                    <label>Ссылка для кнопки</label>
                    <input type="url" id="newsLink" placeholder="https://...">
                </div>
                <div class="form-group">
                    <label>Фото (ссылка)</label>
                    <input type="url" id="newsPhoto" placeholder="https://...">
                </div>
                <button type="submit" class="btn-submit">Опубликовать новость</button>
            </form>
        </div>

        <!-- Форма мероприятий -->
        <div id="eventsTab" class="tab-content">
            <h2>Добавить мероприятие</h2>
            <form id="eventsForm" class="admin-form">
                <div class="form-group">
                    <label>Название *</label>
                    <input type="text" id="eventTitle" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Дата *</label>
                        <input type="date" id="eventDate" required>
                    </div>
                    <div class="form-group">
                        <label>Время *</label>
                        <input type="time" id="eventTime" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Место *</label>
                        <input type="text" id="eventLocation" required>
                    </div>
                    <div class="form-group">
                        <label>Возраст *</label>
                        <select id="eventAge" required>
                            <option value="0+">0+</option>
                            <option value="6+">6+</option>
                            <option value="12+">12+</option>
                            <option value="16+" selected>16+</option>
                            <option value="18+">18+</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Цена (руб) *</label>
                        <input type="number" id="eventPrice" min="0" required>
                    </div>
                    <div class="form-group">
                        <label>Ссылка на билеты</label>
                        <input type="url" id="eventTicket" placeholder="https://...">
                    </div>
                </div>
                <div class="form-group">
                    <label>Фото (ссылка)</label>
                    <input type="url" id="eventPhoto" placeholder="https://...">
                </div>
                <button type="submit" class="btn-submit">Опубликовать мероприятие</button>
            </form>
        </div>

        <div id="message" class="message"></div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
